name: Profile assets
on:
  workflow_dispatch:
  push:
  schedule:
    - cron: "17 3 * * *"
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pillow
      - run: python scripts/generate_contribution_svg.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: Platane/snk@v3
        with:
          github_user_name: ToshitSai
          outputs: dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2339d353&color_dots=%23161b22%230e4429%23006d32%2326a641%2339d353
      - name: Commit generated assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets
          git diff --cached --quiet || git commit -m "chore: refresh profile assets [skip ci]"
          git pull --rebase origin main
          git push
      - name: Publish dark snake to output branch
        run: |
          cp dist/github-contribution-grid-snake-dark.svg /tmp/github-contribution-grid-snake-dark.svg
          git fetch origin output:output || true
          git checkout --orphan output
          git rm -rf . || true
          cp /tmp/github-contribution-grid-snake-dark.svg github-contribution-grid-snake-dark.svg
          git add github-contribution-grid-snake-dark.svg
          git commit -m "chore: publish dark contribution snake [skip ci]"
          git push origin output --force
